  }

  /* ---------- automatic workout ----------
     Each split is a list of movement slots a coach would use (squat, push, row, hinge…).
     The first three are the main lifts; the rest are ordered by what is behind this week.
     Each slot is filled with the best exercise for your equipment and level, favouring lifts
     you have done recently (so progress is easy to track) with a little weekly variety. */
  const NOT_AUTO = /burpee|jump|mountain climber|shoulder tap|thruster|clean and press|halo|carry/i;
  const SLOT = {
    squat: { m: ['quads'], c: true, not: /lunge|split|step-up|bulgarian|cossack/i, like: /goblet|back squat|front squat|^dumbbell squat|air squat/i },
    lunge: { m: ['quads', 'glutes', 'adductors'], c: true, only: /lunge|split|step-up|bulgarian/i, again: true },
    hinge: { m: ['hamstrings', 'glutes'], c: true, only: /deadlift|rdl|good morning|swing|rack pull/i, like: /romanian|^dumbbell deadlift|^deadlift|kettlebell deadlift/i },
    glute: { m: ['glutes'], not: /deadlift|rdl|swing|lunge|rack pull/i, like: /thrust|bridge/i },
    ham: { m: ['hamstrings'], not: /good morning/i },
    hpush: { m: ['chest'], c: true, not: /incline|decline|knee/i, like: /bench press|push-up|floor press/i },
    incline: { m: ['chest'], c: true, like: /incline/i, again: true },
    fly: { m: ['chest'], c: false },
    vpush: { m: ['shoulders'], c: true, not: /upright|pike/i, like: /overhead|standing|seated|press/i },
    delt: { m: ['shoulders'], c: false, like: /lateral/i },
    rear: { m: ['shoulders', 'traps'], c: false, like: /rear|y-raise/i, again: true },
    row: { m: ['lats'], c: true, only: /row/i, like: /one-arm|bent-over|chest-supported/i },
    row2: { m: ['lats', 'traps'], c: true, only: /row/i, again: true },
    vpull: { m: ['lats'], not: /row/i, like: /pull-up|chin-up/i },
    trap: { m: ['traps'], like: /shrug/i },
    bi: { m: ['biceps'] }, tri: { m: ['triceps'] }, calf: { m: ['calves'] }, add: { m: ['adductors'] }, fore: { m: ['forearms'] },
    abs: { m: ['abs'] }, obl: { m: ['obliques'] }, lowback: { m: ['lowerback'] },
  };
  const SLOTS = {
    full: ['squat', 'hpush', 'row', 'hinge', 'vpush', 'abs', 'bi'],
    fullB: ['hinge', 'vpush', 'vpull', 'lunge', 'incline', 'tri', 'obl'],
    fullC: ['squat', 'hpush', 'row', 'glute', 'delt', 'calf', 'abs'],
    push: ['hpush', 'vpush', 'incline', 'delt', 'tri', 'fly', 'abs'],
    pull: ['vpull', 'row', 'row2', 'rear', 'bi', 'trap', 'lowback'],
    legs: ['squat', 'hinge', 'lunge', 'ham', 'calf', 'add', 'abs'],
    upper: ['hpush', 'row', 'vpush', 'vpull', 'delt', 'bi', 'tri'],
    lower: ['squat', 'hinge', 'lunge', 'glute', 'calf', 'abs', 'obl'],
  };
  const STAPLE = new Set(['goblet-squat', 'back-squat', 'db-squat', 'db-bench', 'bb-bench', 'push-up', 'incline-db-press', 'one-arm-row', 'bb-row', 'db-bent-row', 'chest-supported-row', 'rdl', 'bb-rdl', 'db-deadlift', 'kb-deadlift', 'db-ohp', 'bb-ohp', 'kb-press', 'pull-up', 'chin-up', 'reverse-lunge', 'bulgarian', 'hip-thrust', 'db-hip-thrust', 'glute-bridge', 'lateral-raise', 'db-curl', 'oh-ext', 'calf-raise', 'plank', 'dead-bug', 'kb-swing', 'kb-goblet-squat', 'kb-row', 'kb-floor-press', 'db-floor-press']);
  const pattern = e => { const n = e.name.toLowerCase(), p = e.primary[0];
    if (/deadlift|rdl|romanian|good morning|swing|rack pull/.test(n)) return 'hinge';
    if (/lunge|split squat|step-up|bulgarian/.test(n)) return 'lunge';
    if (p === 'quads' && e.compound) return 'squat';
    if (/row/.test(n) && p !== 'shoulders') return 'row';
    if (/pull-up|chin-up/.test(n)) return 'vpull';
    return p + (e.compound ? '*' : ''); };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; };
  const isCore = e => ['abs', 'obliques', 'lowerback'].includes(e.primary[0]);
  function buildSession(ctx, key) {
    const sp = SPLITS[key] || SPLITS.full, now = ctx.now || Date.now(), wk = Math.floor(weekStart(now) / (7 * DAY));
    const v = volume(ctx.log, now - 7 * DAY), rec = recovery(ctx.log, now);
    const recent = new Map(); ctx.log.forEach(e => { if (e.t > now - 28 * DAY) recent.set(e.ex, (recent.get(e.ex) || 0) + 1); });
    const lvl = Math.max(1, ctx.level || 1);
    const pool = EXERCISES.filter(e => canDo(e, ctx.equip) && e.level <= lvl && !NOT_AUTO.test(e.name) && (!ctx.allowed || ctx.allowed(e)));
    const needOf = m => { const lo = MUSCLES[m].range[0]; return (Math.max(0, lo - v[m]) / lo + 0.4) * (0.3 + 0.7 * rec[m]); };
    const slotNeed = k => Math.max(...SLOT[k].m.map(needOf));
    const keys = SLOTS[key] || SLOTS.full, main = keys.slice(0, 3), acc = keys.slice(3).sort((a, b) => slotNeed(b) - slotNeed(a));
    const n = lvl === 1 ? 5 : lvl === 2 ? 6 : 7, picks = [];
    for (const k of main.concat(acc)) {
      if (picks.length >= n) break;
      const sl = SLOT[k];
      if (Math.max(...sl.m.map(m => rec[m])) < 0.3 && main.indexOf(k) < 0) continue; // still worn out: leave it for another day
      let best = null, bs = -Infinity;
      pool.forEach(e => {
        const pi = sl.m.indexOf(e.primary[0]); if (pi < 0 || picks.includes(e)) return;
        if (sl.c !== undefined && !!e.compound !== sl.c) return;
        if (sl.only && !sl.only.test(e.name)) return; if (sl.not && sl.not.test(e.name)) return;
        if (!sl.again && picks.some(p => pattern(p) === pattern(e))) return;
        let s = 10 - pi * 1.5 + (sl.like && sl.like.test(e.name) ? 4 : 0) + (STAPLE.has(e.id) ? 2 : 0) + (e.level === lvl ? 1.2 : e.level < lvl - 1 ? -1.5 : 0);
        s += Math.min(3, recent.get(e.id) || 0) * 0.7 + hash(key + ':' + wk + ':' + e.id) * 3 - e.secondary.length * 0.15;
        if (s > bs) { bs = s; best = e; }
      });
      if (best) picks.push(best);
    }
    // little equipment: top up with whatever trains this split's muscles best
    for (let any = 0; any < 2 && picks.length < n; any++) while (picks.length < n) {
      let best = null, bs = -Infinity;
      pool.forEach(e => {
        if (picks.includes(e) || (!any && !sp.focus.includes(e.primary[0])) || picks.some(p => pattern(p) === pattern(e))) return;
        const s = needOf(e.primary[0]) * 6 + (STAPLE.has(e.id) ? 1.5 : 0) + hash(key + ':' + wk + ':' + e.id) * 2 - (isCore(e) && picks.filter(isCore).length ? 3 : 0);
        if (s > bs) { bs = s; best = e; }
      });
      if (!best) break; picks.push(best);
    }
    picks.sort((a, b) => isCore(a) - isCore(b));
    const g = ctx.goal || 'muscle';
    const items = picks.map(e => [e.id, g === 'strength' ? (e.compound ? 4 : 3) : g === 'endurance' ? 2 : (e.compound ? 4 : 3), e.primary[0] === 'abs' && /plank|hold|dead bug|bird/i.test(e.name) ? (g === 'endurance' ? '45 s' : '30–40 s') : g === 'strength' ? (e.compound ? '5' : '8–10') : g === 'endurance' ? '15–20' : (e.compound ? '8–10' : '10–12')]);
    return { id: 'auto', key, name: sp.name, level: lvl, days: 'Today', mins: Math.round(items.reduce((a, it) => a + it[1] * 2.7, 6) / 5) * 5,
      focus: `Built for today from your equipment, this week’s gaps and what is still recovering.`, items, auto: true,
      note: 'Weights and reps are suggested from your last session. Beat them by one rep or a small step in weight.' };
  }

  /* ---------- progression ---------- */
  const e1rm = (kg, reps) => kg > 0 && reps > 0 ? kg * (1 + Math.min(reps, 12) / 30) : 0;
  function range(reps) { const m = String(reps).match(/(\d+)(?:\s*[–-]\s*(\d+))?/); if (!m) return [8, 12]; const a = +m[1], b = m[2] ? +m[2] : a; return [a, b]; }
  function lastSession(log, exId) {
    let last = null; for (let i = log.length - 1; i >= 0; i--) { if (log[i].ex === exId) { last = log[i]; break; } }
    if (!last) return null;
    const day = new Date(last.t).toDateString();
    return log.filter(l => l.ex === exId && new Date(l.t).toDateString() === day);
  }
  function step(e) { const n = e.needs || []; return n.includes('bb') ? 2.5 : n.includes('kb') ? 4 : n.includes('db') ? 2 : n.includes('plate') ? 2.5 : 0; }
  // double progression: hit the top of the rep range on every set, then add weight
  function suggest(log, exId, reps) {
    const e = EX[exId], s = lastSession(log, exId); if (!e || !s || !s.length) return null;
    const [lo, hi] = range(reps), top = Math.max(...s.map(x => x.kg || 0)), atTop = s.filter(x => (x.kg || 0) === top), best = Math.max(...atTop.map(x => x.reps));
    const inc = step(e);
    if (!top || !inc) return { kg: 0, reps: Math.min(best + 1, hi + 10), why: best >= hi ? 'Add a rep or slow the lowering' : 'One more rep than last time', last: s };
    if (atTop.every(x => x.reps >= hi)) return { kg: top + inc, reps: lo, why: `Up the weight: you hit ${hi} reps on every set`, last: s };
    return { kg: top, reps: Math.min(hi, best + 1), why: 'Same weight, one more rep', last: s };
  }

  /* ---------- records ---------- */
  function history(log, exId) {
    const days = new Map();
    log.forEach(l => { if (l.ex !== exId) return; const k = new Date(l.t).toDateString(); const d = days.get(k) || { t: l.t, sets: [], best: 0, top: 0, reps: 0 }; d.sets.push(l); d.best = Math.max(d.best, e1rm(l.kg, l.reps)); d.top = Math.max(d.top, l.kg || 0); d.reps = Math.max(d.reps, l.reps); days.set(k, d); });
    return [...days.values()].sort((a, b) => a.t - b.t);
  }
  function records(log, exId) {
    let best = 0, top = 0, reps = 0, bestSet = null;
    log.forEach(l => { if (l.ex !== exId) return; const r = e1rm(l.kg, l.reps); if (r > best) { best = r; bestSet = l; } if ((l.kg || 0) > top) top = l.kg || 0; if (!l.kg && l.reps > reps) reps = l.reps; });
    return { best, top, reps, bestSet };
  }
  // which of the new entries beat the previous best (heaviest weight, best estimated max, or most bodyweight reps)
  function newRecords(before, entries) {
    const out = [];
    const byEx = {}; entries.forEach(e => (byEx[e.ex] = byEx[e.ex] || []).push(e));
    Object.keys(byEx).forEach(id => {
      const r = records(before, id); if (!before.some(l => l.ex === id)) return; // first time is a baseline, not a record
      let hit = null;
      byEx[id].forEach(e => {
        const x = e1rm(e.kg, e.reps);
        if ((e.kg || 0) > r.top && e.kg) hit = { ex: id, kind: 'weight', set: e };
        else if (x > r.best * 1.001 && x) hit = hit || { ex: id, kind: 'e1rm', set: e };
        else if (!e.kg && !r.top && e.reps > r.reps) hit = hit || { ex: id, kind: 'reps', set: e };
      });
      if (hit) out.push(hit);
    });
    return out;
  }

  /* ---------- weeks ---------- */
  function trainingDays(log, from, to) { return new Set(log.filter(l => l.t >= from && l.t < to).map(l => new Date(l.t).toDateString())).size; }
  function streak(log, target, now = Date.now()) {
    if (!log.length) return 0;
    let n = 0, ws = weekStart(now);
    if (trainingDays(log, ws, ws + 7 * DAY) >= target) n++;
    for (let w = ws - 7 * DAY; w > ws - 104 * 7 * DAY; w -= 7 * DAY) { if (trainingDays(log, w, w + 7 * DAY) >= target) n++; else break; }
    return n;
  }
  function weekSummary(log, from, to) {
    const L = log.filter(l => l.t >= from && l.t < to);
    return { days: trainingDays(log, from, to), sets: L.length, volume: Math.round(L.reduce((a, l) => a + (l.kg || 0) * l.reps, 0)), prs: newRecords(log.filter(l => l.t < from), L).length };
  }
  return { SPLITS, template, DEFAULT_DAYS, weekStart, wd, volume, recovery, buildSession, suggest, range, e1rm, history, records, newRecords, streak, weekSummary, trainingDays, lastSession };
})();

  /* ---------------- progress: photos ---------------- */
  function photosView() {
    const ps = S.photos;
    const done = photoThisWeek();
    const privacy = Cloud.kind === 'claude' ? 'Saved to your Claude account.' : Cloud.backupReady ? 'Saved on this device. Cloud backup is enabled for this account.' : 'Saved on this device. Cloud backup is optional in Account.';
    const head = `<div class="photo-cta card ${done ? 'done' : ''}">
      <div class="pc-ic">${done ? ICON.check : ICON.camera}</div>
      <div class="pc-txt"><b>${done ? 'This week’s photo is in' : ps.length ? 'Time for this week’s photo' : 'Add your first progress photo'}</b><span class="small muted">${done ? 'Add another angle, or come back next week.' : `Same spot, same light, every ${DAYS[S.photoDay]}${S.photoDay ? ' or later' : ''}.`}</span></div>
      <button class="btn primary sm" data-act="addPhoto">${ICON.camera}${done ? 'Add' : 'Take photo'}</button>
    </div>
    <div class="row photo-acts"><button class="link" data-act="uploadPhoto">${ICON.gallery}Upload from your photos</button></div>
    <p class="tiny muted privacy">${ICON.lock}${privacy}</p>`;
    if (!ps.length) return head + `
      <div class="empty-photos card">
        <svg viewBox="0 0 220 150" aria-hidden="true" class="ep-art">
          <defs><linearGradient id="ep-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9248"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#34E0F0"/></linearGradient></defs>
          ${[0, 1, 2].map(i => `<g transform="translate(${18 + i * 66} ${i === 1 ? 6 : 16})" opacity="${i === 1 ? 1 : .55}"><rect width="58" height="${i === 1 ? 118 : 104}" rx="12" fill="rgba(255,255,255,.04)" stroke="url(#ep-g)" stroke-width="1.5"/><circle cx="29" cy="${i === 1 ? 34 : 30}" r="9" fill="none" stroke="url(#ep-g)" stroke-width="1.5"/><path d="M14 ${i === 1 ? 92 : 82}c0-14 6-24 15-24s15 10 15 24" fill="none" stroke="url(#ep-g)" stroke-width="1.5"/></g>`).join('')}
        </svg>
        <h3 class="h3">Your weekly timeline starts here</h3>
        <p class="small muted">Take a front, side and back photo once a week. After a few weeks you can slide between them and see the change.</p>
      </div>`;
    // group by week
    const first = weekStart(ps[0].t), weeks = new Map();
    ps.forEach(p => { const n = Math.round((weekStart(p.t) - first) / (7 * DAY)) + 1; if (!weeks.has(n)) weeks.set(n, []); weeks.get(n).push(p); });
    const nWeeks = [...weeks.keys()];
    let streak = 0; for (let w = Math.round((weekStart(Date.now()) - first) / (7 * DAY)) + 1 - (done ? 0 : 1); weeks.has(w); w--) streak++;
    const wt = MEASURE.weight;
    const tl = [...weeks.entries()].sort((a, b) => b[0] - a[0]).map(([n, list]) => {
      const ws = first + (n - 1) * 7 * DAY, we = ws + 7 * DAY;
      const m = S.measExample ? null : S.meas.filter(e => e.t >= ws && e.t < we && e.v.weight != null).pop();
      return `<div class="tl-week">
        <div class="tl-node"><span>${n}</span></div>
        <div class="tl-body">
          <div class="tl-head"><b>Week ${n}</b><span class="muted small">${dateShort(ws)}${m ? ` · ${num(Units.toMass(m.v.weight))} ${Units.mass()}` : ''}</span></div>
          <div class="tl-photos">${list.sort((a, b) => a.t - b.t).map(p => `<button class="ph" data-photo-open="${p.id}"><img data-photo="${p.id}" alt="${p.pose} photo, ${dateShort(p.t)}"><span class="pose">${p.pose}</span></button>`).join('')}</div>
        </div></div>`;
    }).join('');
    return head + `
      <div class="stat-row">
        <div class="stat card"><b>${ps.length}</b><span>photos</span></div>
        <div class="stat card"><b>${nWeeks.length}</b><span>weeks</span></div>
        <div class="stat card"><b>${streak}</b><span>week streak</span></div>
      </div>
      ${ps.length > 1 ? `<div class="row"><button class="btn ghost" style="flex:1" data-act="compare">${ICON.compare}Compare${unlocked() ? '' : ' ' + ICON.lock}</button><button class="btn ghost" style="flex:1" data-act="timelapse">${ICON.film}Timelapse${unlocked() ? '' : ' ' + ICON.lock}</button></div>` : ''}
      <section class="timeline">${tl}</section>`;
  }

  /* ---------------- progress: measurements ---------------- */
  function sparkline(m, s) {
    if (!s || s.comb.length < 2) return `<svg class="spark" viewBox="0 0 100 30" aria-hidden="true"><path d="M0 22 H100" class="sp-flat"/></svg>`;
    const pts = s.comb, t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
    let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v)); if (hi - lo < 0.5) { lo -= 0.25; hi += 0.25; }
    const xy = pts.map(p => [((p.t - t0) / Math.max(1, t1 - t0)) * 100, 26 - (p.v - lo) / (hi - lo) * 22]);
    const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const cls = deltaClass(m, s.delta);
    return `<svg class="spark ${cls}" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L100 30 L0 30 Z" class="sp-area"/><path d="${d}" class="sp-line"/><circle cx="${xy[xy.length - 1][0]}" cy="${xy[xy.length - 1][1]}" r="2.2" class="sp-dot"/></svg>`;
  }
  function measView() {
    const cards = MEASURES.map(m => {
      const s = measSummary(m), on = S.measSel === m.id;
      const val = !s ? '<b class="none">–</b>' : m.pair
        ? `<span class="lr"><span><em>L</em><b>${s.last[0] == null ? '–' : num(mShow(m.kind, s.last[0]))}</b></span><span><em>R</em><b>${s.last[1] == null ? '–' : num(mShow(m.kind, s.last[1]))}</b></span></span>`
        : `<b>${num(mShow(m.kind, s.last[0]))}</b>`;
      return `<button class="mcard ${on ? 'on' : ''}" data-msel="${m.id}" aria-pressed="${on}">
        <span class="mc-top"><span class="mc-name">${m.name}</span>${s && s.comb.length > 1 ? `<span class="delta ${deltaClass(m, s.delta)}">${deltaShow(m, s.delta)}</span>` : ''}</span>
        <span class="mc-val">${val}<span class="u">${mUnit(m.kind)}</span></span>
        ${sparkline(m, s)}
      </button>`;
    }).join('');
    const sel = MEASURE[S.measSel], ss = sel && measSummary(sel);
    return `
      ${S.measExample ? `<div class="banner"><div><b>These are example measurements.</b>Your first entry replaces them.</div><button class="link" data-act="clearMeasExample">Clear them</button></div>` : ''}
      <button class="btn primary block" data-act="addMeas">${ICON.plus}Add measurements</button>
      ${sel ? `<div class="sel-meas card">
        <div class="sm-top"><div><div class="eyebrow">${sel.group}</div><h3 class="h2">${sel.name}</h3></div><button class="btn ghost sm" data-mdetail="${sel.id}">History${ICON.chev}</button></div>
        <p class="small muted">${ICON.tape}${sel.tip}</p>
        ${ss && ss.comb.length > 1 ? `<p class="small">Change since ${dateShort(ss.since)}: <span class="delta ${deltaClass(sel, ss.delta)}">${deltaShow(sel, ss.delta)} ${mUnit(sel.kind)}</span></p>` : ''}
      </div>` : ''}
      <div class="mcards">${cards}</div>
      <div class="row units-row"><span class="small muted">Units</span><div class="seg" role="group" aria-label="Units"><button data-units="metric" aria-pressed="${!imp()}">cm · kg</button><button data-units="imperial" aria-pressed="${imp()}">in · lb</button></div></div>
      <p class="tiny muted">Green change is progress for building muscle: bigger arms, legs, chest and shoulders, a smaller waist and lower body fat.</p>`;
  }

  /* ---------------- view parts ---------------- */
  function exampleNote() { return `<div class="banner"><div><b>This is an example week.</b>Your own sets replace it as soon as you log one.</div><button class="link" data-act="clearExample">Clear it</button></div>`; }
  function exRow(e, role) {
    const ok = exAllowed(e.id);
    return `<button class="item${ok ? '' : ' is-locked'}" data-ex="${e.id}">${Thumbs.img('e:' + e.id, 'sm')}<span class="item-main"><span class="item-title">${e.name}</span><span class="item-sub">${esc(e.kit)}</span><span class="item-tags">${levelBadge(e.level)}${role ? `<span class="tag${role === 'Main' ? '' : ' alt'}">${role}</span>` : ''}${ok ? '' : lockTag()}</span></span>${ICON.chev.replace('<svg', '<svg class="chev"')}</button>`;
  }
  function libraryList() {
    const q = S.libQ.trim().toLowerCase();
    const hay = e => (e.name + ' ' + e.kit + ' ' + e.primary.concat(e.secondary).map(m => MUSCLES[m].name).join(' ')).toLowerCase();
    const list = EXERCISES.filter(e => (S.libRegion === 'All' || MUSCLES[e.primary[0]].region === S.libRegion) && (!S.libMine || canDo(e, S.equip)) && (!q || q.split(/\s+/).every(w => hay(e).includes(w))));
    if (!list.length) return `<div class="card empty">No exercises match${S.libMine ? ' with your equipment. Turn off “Only my equipment” to see more.' : '. Try another word.'}</div>`;
    const groups = MUSCLE_IDS.map(id => [id, list.filter(e => e.primary[0] === id)]).filter(g => g[1].length);

    const picks = [];

    [...chosen].forEach(m => {

      let c = EXERCISES.filter(e => e.primary[0] === m && !picks.includes(e)).sort(rank);

  async function exportWorkoutCsv(button) {
    if (!trainingApi()) { toast('Training tools could not load. Close and reopen Iron Atlas.'); return; }
    if (S.example || !S.log.length) { toast('Log a workout first. Example sets are not exported.'); return; }
    button.disabled = true;
    const ownLog = S.log.map(r => ({ ...r }));
    try {
      const csv = trainingApi().exportWorkoutCsv(ownLog, EX, { unit: Units.mass() });
      const result = await Saver.share(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'iron-atlas-workouts.csv', 'Iron Atlas workout records');
      if (result === 'failed') toast('Could not export your workouts. Your records are unchanged.');
      else if (result !== 'cancelled') toast('Workout CSV exported');
    } catch (error) { toast(error.message || 'Could not export your workout records.'); }
    finally { button.disabled = false; }
  }
  async function exportSourceCode(button) {
    const data = sheetData;
    button.disabled = true;
    const status = $('#sourceExportStatus'); if (status) status.textContent = 'Preparing source archive…';
    try {
      const response = await fetch('source/iron-atlas-source.zip');
      if (!response.ok) throw Error('Source archive is not available in this build. Please contact support.');
      const bytes = await response.arrayBuffer(), head = new Uint8Array(bytes, 0, Math.min(4, bytes.byteLength));
      if (head.length !== 4 || head[0] !== 80 || head[1] !== 75 || head[2] !== 3 || head[3] !== 4) throw Error('The source archive could not be read. Please contact support.');
      const result = await Saver.share(new Blob([bytes], { type: 'application/zip' }), 'iron-atlas-source.zip', 'Iron Atlas corresponding source code');
      if (result === 'failed') throw Error('Could not save the archive. Try again or contact support.');
      if (sheetKind === 'openSource' && sheetData === data) $('#sourceExportStatus').textContent = result === 'cancelled' ? 'Export cancelled.' : 'Source archive exported.';
    } catch (error) { if (sheetKind === 'openSource' && sheetData === data) $('#sourceExportStatus').textContent = error.message; }
    finally { button.disabled = false; }
  }

      if (st === 0) return `${head}
        <div class="ob-hero"><div class="ob-logo">${ICON.spark}</div><h2 class="display sm">Let’s build your plan</h2>
        <p class="lede">Five quick questions and Iron Atlas will set up a weekly programme that fits your goal, your equipment and your week.</p></div>
        ${nav(1, 'Get started')}<button class="link center" data-close>Not now</button>`;
      if (st === 1) return `${head}<h2 class="h2 ob-q">What’s your main goal?</h2>
        <div class="ob-list">${card('data-obgoal', 'muscle', d.goal, 'Build muscle', 'Look more defined and add size. 8–12 reps.', '💪')}${card('data-obgoal', 'strength', d.goal, 'Get stronger', 'Lift heavier weights. 4–6 reps.', '🏋️')}${card('data-obgoal', 'endurance', d.goal, 'Tone and endurance', 'Lighter weights, more reps, shorter rests.', '⚡')}</div>${nav(2)}`;

        <div class="ob-list">${EQUIP_PRESETS.map(pr => card('data-obpreset', pr.id, d.preset, pr.name, pr.sub)).join('')}</div>
        <div class="stack-s"><div class="eyebrow">Or pick exactly what you have</div><div class="chips">${EQUIP_IDS.map(x => `<button class="chip" data-obequip="${x}" aria-pressed="${d.equip.includes(x)}">${EQUIP[x].name}</button>`).join('')}</div>
        <p class="tiny muted">${EXERCISES.filter(e => canDo(e, d.equip)).length} exercises suit this set-up.</p></div>${nav(4)}`;
      if (st === 4) return `${head}<h2 class="h2 ob-q">Which days can you train?</h2>
        <div class="days big">${DAYS.map((dn, i) => `<button data-obday="${i}" aria-pressed="${d.schedule.includes(i)}" aria-label="${dn}">${DAY3[i]}</button>`).join('')}</div>
        <p class="small muted">${d.schedule.length < 2 ? 'Pick at least two days.' : d.schedule.length > 6 ? 'Keep at least one rest day.' : `${d.schedule.length} days a week. ${d.schedule.length >= 5 ? 'Plenty: each muscle gets two sessions.' : d.schedule.length === 2 ? 'Two full-body sessions cover everything.' : 'A great amount for steady progress.'}`}</p>
        <div class="stack-s"><div class="eyebrow">Figure</div><div class="seg wide"><button data-obsex="m" aria-pressed="${d.sex === 'm'}">Male</button><button data-obsex="f" aria-pressed="${d.sex === 'f'}">Female</button></div></div>
        ${nav(5, 'Build my plan', d.schedule.length >= 2 && d.schedule.length <= 6)}`;
      const split = Program.template(d.schedule.length, d.level);
      return `${head}<div class="ob-hero"><h2 class="display sm">Your plan is ready</h2>
        <p class="lede">${SETS[d.goal].label}, ${d.schedule.length} days a week, ${d.equip.length ? 'with ' + listText(d.equip.map(x => EQUIP[x].short.toLowerCase())) : 'bodyweight only'}.</p></div>
        <div class="card prog-sum">${d.schedule.map((dd, i) => `<div class="ps-row"><span class="ps-day">${DAY3[dd]}</span><span class="ps-name">${esc(Program.SPLITS[split[i]].name)}</span></div>`).join('')}</div>
        ${unlocked() ? `<p class="small muted">Each session is built fresh from your equipment, what is behind this week and what is still recovering, with a target weight for every set.</p>
          <button class="btn primary block lg" data-ob="finish">${ICON.check}Start my programme</button>`
        : `<div class="ob-trial card"><b>Explore Premium</b><span class="small muted">A fresh workout built for you every session, weight targets that keep you progressing, and all ${EXERCISES.length} exercises.</span></div>
          <button class="btn primary block lg" data-ob="trial">See Premium options</button>
          <button class="btn ghost block" data-ob="finish">Continue with the free plan</button>`}`;
    },

    swap(d) {

      alts.sort((a, b) => (exAllowed(b.id) - exAllowed(a.id)) || ((b.primary[0] === cur.primary[0]) - (a.primary[0] === cur.primary[0])) || (Math.abs(a.level - S.level) - Math.abs(b.level - S.level)));
      return `<div class="sheet-head"><div><div class="eyebrow">Swap ${esc(cur.name)}</div><h3 class="h2">Same muscles, different move</h3></div><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></div>

  async function receiveAssigned(account) {
    const scope = { uid: Cloud.user?.id, epoch: Cloud.sessionEpoch, generation: Cloud.backupState?.generation };
    const current = () => Cloud.acct === account && Cloud.user?.id === scope.uid && Cloud.sessionEpoch === scope.epoch && Cloud.backupState?.generation === scope.generation && Cloud.backupReady;
    if (!Cloud.moderationReady || !current()) return;
    const deliveries = await Cloud.coach.pendingAssigned(scope);
    if (!current() || !Array.isArray(deliveries)) return;
    const ids = [], added = [];
    for (const delivery of deliveries) {
      if (!delivery || delivery.recipient !== Cloud.user.id || !/^[1-9]\d{0,18}$/.test(delivery.id)) continue;
      const source = IronAtlasModeration.source({ kind: 'assigned_plan', reference: delivery.id, author: delivery.author });
      if (!source || !Cloud.canShowShared(source.author) || !IronAtlasModeration.allowed({ plan: delivery.plan, coach: delivery.coach })) continue;
      const id = 'assigned-' + delivery.id;
      const existing = S.myPlans.find(plan => plan.id === id);
      if (!existing) {
        const plan = normPlan(delivery.plan);
        if (!plan) continue;
        const mine = asMyPlan(plan, { id, trainer: planText(delivery.coach, 60) || plan.by || 'your trainer', source });
        S.myPlans.push(mine); added.push(mine);
      } else if (!existing.source) existing.source = source;
      ids.push(delivery.id);
    }
    if (!ids.length || !current() || !Store.save()) return;
    if (added.length) {
      render(true);
      toast(added.length === 1 ? `New plan from ${added[0].trainer}: ${added[0].name}` : `${added.length} new plans from ${added[0].trainer}`);
    }
    if (current()) await Cloud.coach.ackAssigned(ids, scope);

      const pa = t.closest('[data-peadd]'); if (pa) { const id = pa.dataset.peadd; if (!d.plan.items.some(it => it[0] === id)) d.plan.items.push([id, 3, EX[id].compound ? '8–10' : '10–12']); d.picking = false; return refreshSheet(); }
      const pe = t.closest('[data-pe]'); if (pe) {

        if (op2 === 'del') it.splice(+i, 1);
        if (op2 === 'up' && +i > 0) { const tmp = it[+i - 1]; it[+i - 1] = it[+i]; it[+i] = tmp; }
        return refreshSheet();
      }
      const nt = t.closest('[data-notif]'); if (nt) { const k = nt.dataset.notif; if (!S.notif[k]) { const perm = await Notify.permission(); if (perm !== 'granted') { toast('Allow notifications for Iron Atlas in your phone’s settings first.'); return; } } S.notif[k] = !S.notif[k]; Store.save(); reschedule(); return refreshSheet(); }
      const a = t.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;
      if (commonAct(act, a)) return;

      if (act === 'compare') { if (!gate('compare')) return; return openCompare(a.dataset.with); }
      if (act === 'signout') return signOut();
      if (act === 'enableBackup') return openSheet('backupConsent', { owner: Cloud.acct });
      if (act === 'confirmBackup') {
        if (sheetData.owner !== Cloud.acct) { toast('Account changed. Reopen the backup choice.'); return; }
        if (!$('#backupConsent')?.checked) { $('#backupMsg').textContent = 'Tick the optional cloud backup choice to enable it.'; return; }
        try { await enableCloudBackup(); } catch (error) { if ($('#backupMsg')) $('#backupMsg').textContent = error.message; }
        return;
      }
      if (act === 'withdrawBackup') return withdrawCloudBackup();
      if (act === 'retryWithdrawal') return withdrawCloudBackup(false, !!Cloud.withdrawal);
      if (act === 'refreshBackup') { try { await Cloud.refreshBackup(); refreshSheet(); } catch (error) { toast(error.message); } return; }
      if (act === 'finishWithdrawalMissing') return withdrawCloudBackup(true, true);
      if (act === 'importGuest') return importGuestRecords();
      if (act === 'reviewNewBackup') {
        const intendedOwner = Cloud.acct;
        if (!await confirmDialog({ title: 'Review newer backup?', text: 'Keep the earlier retained copy and review this device against the newer cloud generation. Choose a saved copy before uploading existing device records.', ok: 'Review newer backup' })) return;
        const owner = Cloud.acct;
        if (owner !== intendedOwner) { toast('Account changed. Reopen the newer-backup review.'); return; }
        try {
          await Cloud.reviewNewBackup();
          if (Cloud.acct !== owner) return;
          const before = JSON.parse(JSON.stringify(toDocs())), docs = await Cloud.load(before);
          if (Cloud.acct !== owner || docs === undefined) return;
          await Cloud.accept(reconcileSync(before, docs, Cloud.pendingReceipt));
          openSheet('account');
        } catch (error) { toast(error.message); }
        return;
      }
      if (act === 'exportBackup') {
        try {
          const snapshot = { current: toDocs(), retained: await Cloud.exportBackup() };
          const result = await Saver.share(new Blob([JSON.stringify(snapshot)], { type: 'application/json' }), 'iron-atlas-retained-cloud-copy.json', 'Iron Atlas retained cloud copy');
          if (result === 'failed') toast('Could not export. The retained copy is still on this device.');
        } catch (error) { toast(error.message); }
        return;
      }
      if (act === 'exportSync') {
        try {
          const backup = { current: toDocs(), retained: await Cloud.exportSync() };
          const result = await Saver.share(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }), 'iron-atlas-sync-backup.json', 'Iron Atlas saved copies');
          if (result === 'failed') toast('Could not export. Your copies remain stored here.');
        } catch (e) { toast(e.message); }
        return;
      }
      if (act === 'recoverCloud' || act === 'recoverLocal') return recoverSync(act === 'recoverLocal' ? 'local' : 'cloud');
      if (act === 'wipe') return wipeAll(false);
      if (act === 'deleteAccount') return wipeAll(true);
      if (act === 'copyCode') { try { await navigator.clipboard.writeText(d.code); toast('Code copied'); } catch (err) { const r = document.createRange(); r.selectNodeContents($('#shareCode')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Code selected. Copy it from here.'); } return; }
      if (act === 'sendCode') { const txt = `Here’s my Iron Atlas plan “${d.plan.name}”. In Iron Atlas, go to Plans › Add a trainer’s plan and enter: ${d.code}`; try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (err) { return; } const r2 = await Saver.share(new Blob([txt], { type: 'text/plain' }), 'iron-atlas-plan.txt', txt); if (r2 === 'failed') toast('Copy the code and send it in a message.'); return; }
      if (act === 'shareCardGo' || act === 'saveCardGo') { if (!d.blob) return; const r3 = act === 'shareCardGo' ? await Saver.share(d.blob, 'iron-atlas-workout.png', 'My workout with Iron Atlas') : await Saver.save(d.blob, 'iron-atlas-workout.png'); if (r3 === 'saved') toast('Image saved'); if (r3 === 'failed') toast('Couldn’t share from here. Try Save image.'); return; }
      if (act === 'camShot') return camShoot();
      if (act === 'camFlip') { d.facing = d.facing === 'user' ? 'environment' : 'user'; return camStart(); }
      if (act === 'camTimer') { d.timer = d.timer === 10 ? 0 : d.timer === 3 ? 10 : 3; $('#camTimer').textContent = d.timer ? d.timer + ' s' : 'Off'; return; }
      if (act === 'camUpload') { closeSheet(); photoInput.click(); return; }
      if (act === 'tlPlay') { tlToggle(); return; }
      if (act === 'tlSave') return tlExport();
      return;
    }
    if (!panel.contains(t)) return;
    const rg = t.closest('[data-region]'); if (rg) { S.region = rg.dataset.region; return render(true); }
    const lr = t.closest('[data-libregion]'); if (lr) { S.libRegion = lr.dataset.libregion; $$('[data-libregion]', panel).forEach(b => b.setAttribute('aria-pressed', b === lr)); $('#libList').innerHTML = libraryList(); Thumbs.hydrate(panel); return; }
    const pt = t.closest('[data-ptab]'); if (pt) { S.progTab = pt.dataset.ptab; return render(true); }
    const ms = t.closest('[data-msel]'); if (ms) { S.measSel = ms.dataset.msel; stage.setActiveRing(S.measSel); const sd = /calf|hips/.test(S.measSel) ? 160 : 15; stage.viewAngle(sd, 5); return render(true); }
    const mdt = t.closest('[data-mdetail]'); if (mdt) return openSheet('measDetail', { id: mdt.dataset.mdetail });
    const po = t.closest('[data-photo-open]'); if (po) return openSheet('photoView', { id: po.dataset.photoOpen });
    const m = t.closest('[data-muscle]'); if (m) { const id = m.dataset.muscle; go('body', { sel: id, balanceOn: false, recoveryOn: false, from: 'body' }); faceMuscle(id); return; }
    const x = t.closest('[data-ex]'); if (x) { if (S.view === 'workout') syncWorkoutInputs(); return go('exercise', { exId: x.dataset.ex, from: tabOf(S.view) }); }
    const pl = t.closest('[data-plan]'); if (pl) return go('plan', { planId: pl.dataset.plan, from: null });
    const cl = t.closest('[data-client]'); if (cl) return go('client', { clientId: cl.dataset.client });
    const bm = t.closest('[data-bmuscle]'); if (bm) { S.sel = S.sel === bm.dataset.bmuscle ? null : bm.dataset.bmuscle; stage.paint(paintFor()); $$('[data-bmuscle]', panel).forEach(b => b.setAttribute('aria-current', b.dataset.bmuscle === S.sel)); if (S.sel && MUSCLES[S.sel].side === 'back') stage.viewAngle(180, 8); else if (S.sel) stage.viewAngle(0, 8); return; }
    const pk = t.closest('[data-pick]'); if (pk) { const id = pk.dataset.pick; S.builder = S.builder.includes(id) ? S.builder.filter(x => x !== id) : S.builder.concat(id); return render(true); }
    const st = t.closest('[data-step]'); if (st) { const [id, d] = st.dataset.step.split(':'); const inp = $('#' + id); const step = id === 'logKg' ? (parseFloat(inp.value) >= 20 ? 2.5 : 1) * (imp() ? 2 : 1) : 1; inp.value = Math.max(0, (parseFloat(inp.value) || 0) + step * +d); return; }
    const ws = t.closest('[data-wstep]'); if (ws) { const [j, f, d] = ws.dataset.wstep.split(':'); const inp = $((f === 'reps' ? '#wr' : '#wk') + j); const step = f === 'kg' ? (parseFloat(inp.value) >= 20 ? 2.5 : 1) * (imp() ? 2 : 1) : 1; inp.value = Math.max(f === 'reps' ? 1 : 0, (parseFloat(inp.value) || 0) + step * +d); return; }
    const dn = t.closest('[data-done]'); if (dn) {
      syncWorkoutInputs();
      const w = S.workout, r = w.sets[w.i][+dn.dataset.done];
      r.done = !r.done;
      r.completedAt = r.done ? Date.now() : null;
      if (r.done) {
        w.restTotal = restFor(); w.restUntil = r.completedAt + w.restTotal * 1000;
        tickRest(); if (S.notif.rest) Notify.rest(w.restUntil);
      } else Notify.rest(null);
      render(true); return;
    }
    const del = t.closest('[data-del]'); if (del) { const id = del.dataset.del; const i = S.log.findIndex(l => l.id ? l.id === id : String(l.t) === id); if (i >= 0) { S.log.splice(i, 1); Store.save(); render(true); toast('Set deleted'); } return; }
    const a = t.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (commonAct(act, a)) return;
    if (act === 'back') return back();
    if (act === 'clearExample') { S.log = []; S.example = false; Store.save(); render(true); toast('Example week cleared'); return; }
    if (act === 'clearMeasExample') { S.meas = []; S.measExample = false; Store.save(); render(true); toast('Example measurements cleared'); return; }
    if (act === 'start') return startWorkout(curPlan());
    if (act === 'startPlan') { S.planId = a.dataset.id; return startWorkout(PLAN[a.dataset.id]); }
    if (act === 'startSlot') return startSlot(a.dataset.slot);
    if (act === 'viewSlot') return viewSlot(a.dataset.slot);
    if (act === 'library') return go('library', {});
    if (act === 'libMine') { S.libMine = !S.libMine; a.setAttribute('aria-pressed', S.libMine); $('#libList').innerHTML = libraryList(); Thumbs.hydrate(panel); return; }
    if (act === 'editPlan') { const p = curPlan(); if (p) openPlanEditor(p, false); return; }
    if (act === 'savePlan') { const p = curPlan(); if (!p) return; if (!gate('builder')) return; const np = asMyPlan(Object.assign({}, p, { name: p.auto ? p.name + ' (' + dateShort(Date.now()) + ')' : p.name })); S.myPlans.push(np); Store.save(); go('plan', { planId: 'my:' + np.id }, false); toast('Saved to My plans'); return; }
    if (act === 'sharePlan') { const p = curPlan(); if (p) openSharePlan(p); return; }
    if (act === 'delPlan') { const p = curPlan(); if (!p) return; if (!await confirmDialog({ title: 'Delete this plan?', text: '“' + p.name + '” will be removed from My plans.', ok: 'Delete', danger: true })) return; S.myPlans = S.myPlans.filter(x => x.id !== p.id); Store.save(); navStack.length = 0; go('plans', {}, false); toast('Plan deleted'); return; }
    if (act === 'importPlan') return openSheet('importPlan', {});
    if (act === 'assignPlan') return openSheet('assignPlan', {});
    if (act === 'removeClient') return removeClient();
    if (act === 'copyCoachCode') { const code = S.trainer ? S.trainer.code : 'K7Q2XM'; try { await navigator.clipboard.writeText(code); toast('Code copied'); } catch (err) { toast('Your code is ' + code); } return; }
    if (act === 'shareCoachCode') return shareCoachCode();
    if (act === 'coachDemoOff') { S.trainerDemo = false; navStack.length = 0; return go('plans', {}, false); }
    if (act === 'swap') return openSheet('swap', {});
    if (act === 'shareWorkout') return openShareCard();
    if (act === 'build') { if (!S.builder.length) return; if (!gate('builder')) return; S.custom = buildPlan(S.builder, S.goal); return go('plan', { planId: 'custom' }); }
    if (act === 'next' || act === 'prev') { syncWorkoutInputs(); const w = S.workout; w.i += act === 'next' ? 1 : -1; w.restUntil = 0; Notify.rest(null); lastStageKey = ''; return render(); }
    if (act === 'finish') return finishWorkout();
    if (act === 'end') { const any = S.workout.sets.flat().some(r => r.done); if (any) return finishWorkout(); S.workout = null; Notify.rest(null); stage.stop(); lastStageKey = ''; navStack.length = 0; return go('plans', {}, false); }
    if (act === 'rest+') { S.workout.restUntil = Math.max(Date.now(), S.workout.restUntil) + 15000; S.workout.restTotal = Math.max(S.workout.restTotal || 75, Math.ceil((S.workout.restUntil - Date.now()) / 1000)); if (S.notif.rest) Notify.rest(S.workout.restUntil); tickRest(); return; }
    if (act === 'rest0') { S.workout.restUntil = 0; Notify.rest(null); return render(true); }
    if (act === 'addPhoto') return openCamera();
    if (act === 'uploadPhoto') { if (!unlocked() && S.photos.some(p => p.t >= weekStart(Date.now()))) { openSheet('paywall', { feature: 'photos' }); return; } photoInput.click(); return; }
    if (act === 'compare') { if (!gate('compare')) return; return openCompare(); }
    if (act === 'timelapse') { if (!gate('timelapse')) return; return openTimelapse(); }
    if (act === 'addMeas') return openSheet('measure', {});
  });
  document.addEventListener('input', e => {
    if (e.target.closest('#plateToolForm, #maxToolForm')) { updateTrainingTool(e.target.form); return; }
    if (e.target.id === 'libQ') { S.libQ = e.target.value; const l = $('#libList'); if (l) { l.innerHTML = libraryList(); Thumbs.hydrate(l); } }
    if (e.target.id === 'peQ') { sheetData.q = e.target.value; const pos = e.target.selectionStart; refreshSheet(); const q = $('#peQ'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } }
  });
  document.addEventListener('change', e => {
    if (e.target.closest('#plateToolForm, #maxToolForm')) { updateTrainingTool(e.target.form); return; }
    if (e.target.id === 'notifTime') { S.notif.time = e.target.value || '18:00'; Store.save(); reschedule(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'plateToolForm' || e.target.id === 'maxToolForm') { e.preventDefault(); updateTrainingTool(e.target); return; }
    if (e.target.id === 'authForm') { e.preventDefault(); submitAuth(e.target); return; }
    if (e.target.id === 'measForm') { e.preventDefault(); saveMeasurements(e.target); return; }
    if (e.target.id === 'importForm') { e.preventDefault(); importPlanCode($('#importCode').value); return; }
    if (e.target.id === 'coachForm') { e.preventDefault(); submitCoachSetup(e.target); return; }
    if (e.target.id === 'joinForm') { e.preventDefault(); submitJoin(e.target); return; }
    if (e.target.id !== 'logForm') return;
    e.preventDefault();
    const reps = Math.max(1, parseInt($('#logReps').value, 10) || 0), shown = Math.max(0, parseFloat($('#logKg').value) || 0);
    const kg = Math.round(Units.fromMass(shown) * 100) / 100;
    const wasExample = S.example, entry = { t: Date.now(), ex: S.exId, reps, kg };
    const pr = wasExample ? [] : Program.newRecords(S.log, [entry]);
    logSets([entry]);
    if (pr.length) { celebrate(); toast(`New personal record: ${shown ? shown + ' ' + Units.mass() + ' × ' : ''}${reps}!`); render(true); }
    else toast(`Logged ${reps} reps${shown ? ' at ' + shown + ' ' + Units.mass() : ''}${wasExample ? '. Example week cleared.' : ''}`);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!dialogRoot.hidden) closeDialog(false); else if (sheetKind) closeSheet(); } });
  function setSex(s) {
    if (s === S.sex) return;
    S.sex = s; stage.setSex(S.sex); syncSex(); Store.save();
    render(true); if (sheetKind === 'account') refreshSheet();
  }
  function syncSex() { $$('#sexToggle [data-sex]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sex === S.sex)); }
  window.addEventListener('resize', () => { const m = stageMode(); if (app.dataset.stage !== m) render(true); stage.dirty = true; });

  window.IA = { stage, S, Cloud, back: () => {
    if (!dialogRoot.hidden) { closeDialog(false); return true; }
    if (sheetKind) { closeSheet(); return true; }
    if (navStack.length) { back(); return true; }
    if (S.view !== 'body') { go('body', { sel: null }, false); return true; }
    if (S.sel) { S.sel = null; render(); return true; }
    return false;
  } };

  /* ---------------- boot ---------------- */
  // gym and trainer edition: a gym's own name, colours and logo (set in config.js)
  if (BRAND) {
    if (BRAND.name) document.title = BRAND.name;
    const b = $('.brand'); if (b) b.innerHTML = (BRAND.logo ? `<img src="${esc(BRAND.logo)}" alt="" class="brand-logo">` : b.querySelector('svg').outerHTML) + `<span>${esc(BRAND.name || 'Iron Atlas')}</span>${BRAND.poweredBy !== false ? '<small>with Iron Atlas</small>' : ''}`;
    if (Array.isArray(BRAND.colors) && BRAND.colors.length >= 2) { const r = document.documentElement.style; r.setProperty('--g-ember', `linear-gradient(135deg, ${BRAND.colors[0]} 0%, ${BRAND.colors[1]} 100%)`); r.setProperty('--g-brand', `linear-gradient(110deg, ${BRAND.colors[0]} 0%, ${BRAND.colors[1]} 100%)`); r.setProperty('--hl', BRAND.colors[0]); }
  }
  (async () => {
    await Cloud.start();
    const cached = Store.readLocal(Cloud.acct);
    if (!apply(cached)) apply({ example: true });
    stage.setSex(S.sex); syncSex(); renderAvatar(); render();
    if (Cloud.kind !== 'device') {
      const owner = Cloud.acct, before = JSON.parse(JSON.stringify(toDocs()));
      let docs; try { docs = await Cloud.load(cached ? docsFor(cached, new Set()) : null); } catch (e) { docs = undefined; }
      if (Cloud.acct === owner && docs !== undefined) {
        try {
          const local = reconcileSync(before, docs, Cloud.pendingReceipt);
          await Cloud.accept(local);
          if (Cloud.acct === owner && !Cloud.syncIssue) Store.push();
        } catch (e) { toast(e.message); }
      }
    }
    Cloud.LS.set('iron-atlas:last', Cloud.acct);
    renderAvatar();
    await Billing.init();
    
    reschedule();
    refreshModeration().then(() => coachStatus()).then(() => coachSync(true));
    // first launch: the questionnaire, then (store app with accounts) the sign-up offer
    if (!S.onboarded && !Cloud.LS.get('iron-atlas:onboard-seen')) { Cloud.LS.set('iron-atlas:onboard-seen', '1'); setTimeout(() => { if (!sheetKind) openOnboarding(0); }, 700); }
    else maybeWelcome(700);
  })();
})();

(function () {
  var A = typeof Native !== 'undefined' && Native.plugin('App'); if (!A) return;

})();
